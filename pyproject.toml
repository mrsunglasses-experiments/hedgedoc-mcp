[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hedgedoc-mcp"
dynamic = ["version"]
description = "MCP server for HedgeDoc 1.x — create, read, and manage notes on a self-hosted HedgeDoc instance from any MCP-compatible AI agent."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Kanishk Pachauri", email = "eq.itskanishkp@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["mcp", "hedgedoc", "markdown", "notes", "model-context-protocol", "claude", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.10.0,<2.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/mrsunglasses-experiments/hedgedoc-mcp"
Repository = "https://github.com/mrsunglasses-experiments/hedgedoc-mcp"
Issues = "https://github.com/mrsunglasses-experiments/hedgedoc-mcp/issues"

[project.scripts]
hedgedoc-mcp = "hedgedoc_mcp.server:main"
hedgedoc-mcp-login = "hedgedoc_mcp.auth:cli_login"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-mock>=3.12.0", "ruff>=0.4.0"]

[tool.hatch.version]
path = "src/hedgedoc_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hedgedoc_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]   # pycodestyle, pyflakes, warnings, isort, pyupgrade

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
