name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Check the release tag matches the package version
        run: |
          expected="dist/hedgedoc_mcp-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          if [ ! -f "$expected" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME doesn't match the built package ($(ls dist | tr '\n' ' ')). Bump __version__ in src/hedgedoc_mcp/__init__.py."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hedgedoc-mcp/
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (no token secret needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
